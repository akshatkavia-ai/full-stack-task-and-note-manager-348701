# SonarQube configuration for the Task Manager FastAPI backend.
# Placement: repository root of the backend project
#   (full-stack-task-and-note-manager-348701/fastapi_backend/sonar-project.properties).
# Run from this same directory so coverage.xml is discovered at ./coverage.xml.

sonar.projectKey=task-manager-fastapi-backend
sonar.projectName=Task Manager FastAPI Backend
sonar.projectVersion=1.0.0

# Source and test layout
sonar.sources=app
sonar.tests=tests

# Language / runtime
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Coverage: pytest + pytest-cov emit Cobertura XML to coverage.xml (see pyproject.toml).
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/.venv/**
sonar.coverage.exclusions=tests/**,app/__init__.py
